# Laravel Monitor - CI Tests

name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, ctype, fileinfo, tokenizer, xml, curl
          coverage: none

      - name: Install dependencies
        run: |
          cd laravel-monitor
          composer install --prefer-dist --no-interaction

      - name: Run PHPUnit tests
        run: |
          cd laravel-monitor
          php vendor/bin/phpunit --configuration phpunit.xml